<form method="post">
    {% csrf_token %}
    <input type="email" placeholder="Enter your email" name="email">
    <button type="submit">Verify Email</button>
</form>

{% if error %}
<h2 style="color: red">{{error}}</h2>
{% endif %}

{% if success %}
<h2 style="color: green">{{success}}</h2>
{% endif %}
